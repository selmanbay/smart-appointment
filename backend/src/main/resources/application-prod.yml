# Hosted environments: JSON logs, rate limiting on unless explicitly disabled.
logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

management:
  endpoint:
    health:
      show-details: never
