# Safe defaults. Every environment-specific value is an environment variable (ADR-0008).
spring:
  application:
    name: smart-appointment-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_appointment}
    username: ${POSTGRES_USER:sas}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    # The contract first, then what the code currently implements (ADR-0014).
    urls:
      - name: Contract (api/openapi.yaml)
        url: /openapi.yaml
      - name: Implemented (generated from code)
        url: /v3/api-docs
    urls-primary-name: Contract (api/openapi.yaml)

app:
  mail:
    from: ${MAIL_FROM:no-reply@smart-appointment.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    policies:
      auth:
        capacity: 10
        refill-per-minute: 10
      booking:
        capacity: 30
        refill-per-minute: 30
      default:
        capacity: 120
        refill-per-minute: 120
