# All service versions are pinned here so everyone runs the same stack.
# Run from the repository root:  ./scripts/setup.sh && docker compose up
name: smart-appointment

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development SMTP server. All outgoing e-mail shows up at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # Enabled once backend code and backend/Dockerfile exist.
