name: CI

# One pipeline for every PR and every push to main. Each app has separate lint, test and build
# jobs so a failure points at the exact problem. `ci-ok` is the single required check.
# Local equivalents: `make lint`, `make test`, `make verify` (docs/PROJECT_MAP.md section 6).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.exists.outputs.backend == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' && steps.exists.outputs.web == 'true' }}
      android: ${{ steps.filter.outputs.android == 'true' && steps.exists.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
      # An app is built only once its build file exists.
      - id: exists
        run: |
          {
            echo "backend=$([ -f backend/pom.xml ] && echo true || echo false)"
            echo "web=$([ -f web/package-lock.json ] && echo true || echo false)"
            echo "android=$([ -f android/gradlew ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'api/**'
              - '.github/workflows/ci.yml'

  # Repository-wide lint, always runs.
  repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: English only
        run: ./scripts/check-english.sh
      - name: Workflow lint (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
      - name: API contract lint (Redocly)
        run: npx --yes @redocly/cli@2.82.0 lint api/openapi.yaml
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formatting (Spotless)
        run: ./mvnw -B -ntp spotless:check
      - name: Naming, size and design rules (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, slice, architecture and integration tests
        run: ./mvnw -B -ntp verify -Dcheckstyle.skip -Dspotless.check.skip=true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Docker image
        run: docker build --file backend/Dockerfile --tag smart-appointment-backend:ci .

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint (ktlint, Android lint)
        run: ./gradlew ktlintCheck lint
      - name: Unit tests
        run: ./gradlew test
      - name: Build
        run: ./gradlew assembleDebug

  # Single required check in the main ruleset. Skipped jobs count as success; any failure blocks the PR.
  ci-ok:
    if: always()
    needs: [repo-lint, backend-lint, backend-test, backend-image, web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
