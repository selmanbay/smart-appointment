name: No AI attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          fail=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format='%B%n%an <%ae>%n%cn <%ce>' "$sha" | ./scripts/check-ai-attribution.sh; then
              echo "::error::Commit $sha credits an AI tool"; fail=1
            fi
          done
          exit $fail
      - name: Check PR title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | ./scripts/check-ai-attribution.sh
